<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="bgGrad" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#131b2e" />
      <stop offset="45%" stopColor="#0c101c" />
      <stop offset="100%" stopColor="#060911" />
    </linearGradient>

    <!-- Border Gradient: 4-Channel Spectrum (Naver Green, Google Blue, Meta Violet, Pinterest Crimson) -->
    <linearGradient id="borderGrad" x1="20" y1="20" x2="492" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="30%" stopColor="#6366f1" />
      <stop offset="70%" stopColor="#f43f5e" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <linearGradient id="innerGlow" x1="256" y1="20" x2="256" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stopColor="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Letter Gradient: Ultra-Crisp White Titanium -->
    <linearGradient id="letterWhiteGrad" x1="256" y1="180" x2="256" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#e2e8f0" />
    </linearGradient>

    <!-- Dynamic Trend Area Gradient -->
    <linearGradient id="trendAreaGrad" x1="256" y1="180" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stopColor="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Trend Vector Stroke Gradient -->
    <linearGradient id="trendLineGrad" x1="60" y1="360" x2="440" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3b82f6" stop-opacity="0.3" />
      <stop offset="40%" stopColor="#38bdf8" />
      <stop offset="80%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#34d399" />
    </linearGradient>

    <!-- Trend Surge Arrow Gradient -->
    <linearGradient id="trendSurgeGrad" x1="390" y1="180" x2="446" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="116"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="5"
    filter="url(#shadowFilter)"
  />

  <!-- Subtle Glass Highlight Rim -->
  <rect
    x="21"
    y="21"
    width="470"
    height="470"
    rx="111"
    fill="none"
    stroke="url(#innerGlow)"
    stroke-width="1.5"
  />

  <!-- ACV-Style Calibration / Viewfinder Crop Marks -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Calibration -->
    <path d="M 44 68 L 44 44 L 68 44" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" />
    <!-- Top-Right Calibration -->
    <path d="M 468 68 L 468 44 L 444 44" stroke="#818cf8" stroke-width="3" stroke-opacity="0.6" />
    <!-- Bottom-Left Calibration -->
    <path d="M 44 444 L 44 468 L 68 468" stroke="#10b981" stroke-width="3" stroke-opacity="0.6" />
    <!-- Bottom-Right Calibration -->
    <path d="M 468 444 L 468 468 L 444 468" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.6" />
  </g>

  <!-- Telemetry Horizontal Reference Gridlines -->
  <g stroke="#334155" stroke-width="1.2" stroke-dasharray="4 8" stroke-opacity="0.35">
    <line x1="56" y1="160" x2="456" y2="160" />
    <line x1="56" y1="240" x2="456" y2="240" />
    <line x1="56" y1="320" x2="456" y2="320" />
  </g>

  <!-- Top Multi-Channel Telemetry Pill -->
  <g id="channel-telemetry-badge">
    <rect x="166" y="52" width="180" height="28" rx="14" fill="#0c1322" stroke="#1e293b" stroke-width="1.5" />
    <!-- Naver (Green) -->
    <circle cx="190" cy="66" r="4.5" fill="#10b981" />
    <!-- Google (Blue) -->
    <circle cx="234" cy="66" r="4.5" fill="#38bdf8" />
    <!-- Meta (Violet) -->
    <circle cx="278" cy="66" r="4.5" fill="#a855f7" />
    <!-- Pinterest (Crimson) -->
    <circle cx="322" cy="66" r="4.5" fill="#f43f5e" />
  </g>

  <!-- Ambient Trend Telemetry Wave (Background) -->
  <path
    d="M 64 360 C 130 350, 180 320, 230 270 C 280 220, 340 180, 448 138 L 448 370 L 64 370 Z"
    fill="url(#trendAreaGrad)"
  />
  <path
    d="M 64 360 C 130 350, 180 320, 230 270 C 280 220, 340 180, 448 138"
    stroke="url(#trendLineGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- ================= MONOGRAM: OTT ================= -->
  <g id="monogram-OTT">
    <!-- Letter 'O' (Omni Pulse Ring) -->
    <g id="letter-O">
      <rect
        x="66"
        y="166"
        width="114"
        height="158"
        rx="48"
        fill="none"
        stroke="url(#letterWhiteGrad)"
        stroke-width="22"
      />
      <!-- Inner Radar Core -->
      <circle cx="123" cy="245" r="7" fill="#38bdf8" />
      <circle cx="123" cy="245" r="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6" />
    </g>

    <!-- Letter 'T' #1 (Trend) -->
    <g id="letter-T1">
      <!-- Horizontal Crossbar -->
      <rect x="194" y="166" width="108" height="24" rx="8" fill="url(#letterWhiteGrad)" />
      <!-- Vertical Stem -->
      <rect x="236" y="184" width="24" height="140" rx="8" fill="url(#letterWhiteGrad)" />
      <!-- Cyan Calibration Micro-Beam on Crossbar -->
      <line x1="202" y1="172" x2="294" y2="172" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Letter 'T' #2 (Tracker) with Kinetic Growth Vector -->
    <g id="letter-T2">
      <!-- Horizontal Crossbar -->
      <rect x="314" y="166" width="108" height="24" rx="8" fill="url(#letterWhiteGrad)" />
      <!-- Vertical Stem -->
      <rect x="356" y="184" width="24" height="140" rx="8" fill="url(#letterWhiteGrad)" />
      
      <!-- ACV-Style Kinetic Checkmark / Trend Surge Vector -->
      <path
        d="M 398 166 L 442 128"
        stroke="url(#trendSurgeGrad)"
        stroke-width="7"
        stroke-linecap="round"
      />
      <!-- Dynamic Rising Arrow Head -->
      <path
        d="M 444 126 L 426 128 L 442 144 Z"
        fill="#10b981"
      />
      <!-- Telemetry Signal Apex Node -->
      <circle cx="444" cy="126" r="6" fill="#10b981" />
      <circle cx="444" cy="126" r="15" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
    </g>
  </g>

  <!-- Bottom Brand Title -->
  <text
    x="256"
    y="404"
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Pretendard, sans-serif"
    font-size="15"
    font-weight="800"
    letter-spacing="5"
    fill="#94a3b8"
    text-anchor="middle"
  >
    OMNI TREND TRACKER
  </text>
  <text
    x="256"
    y="426"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Courier New', monospace"
    font-size="10.5"
    font-weight="600"
    letter-spacing="2.5"
    fill="#475569"
    text-anchor="middle"
  >
    CROSS-PLATFORM INTELLIGENCE
  </text>
</svg>